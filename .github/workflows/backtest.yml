name: backtest
on:
  schedule:
    - cron: "0 11 * * 1"
  push:
    paths: ["backtest/run.txt"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest
        run: python backtest/backtest.py
      - name: Save
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          mkdir -p /tmp/keep/backtest && cp -r backtest/cache backtest/results.json backtest/results.md /tmp/keep/backtest/
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/keep/. .
            git add backtest/cache backtest/results.json backtest/results.md
            git diff --cached --quiet && exit 0
            git commit -qm "backtest output"
            git push -q && exit 0
            sleep 3
          done
