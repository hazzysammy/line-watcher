name: relay
on:
  push:
    paths: ["relay/request.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        run: python relay/fetch.py
      - name: Save
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git add relay/out
          git diff --cached --quiet && exit 0
          git commit -qm "relay output"
          for i in 1 2 3; do
            git push -q && exit 0
            git fetch -q origin main
            git rebase -q origin/main || { git rebase --abort; git reset -q --soft origin/main; git add relay/out; git commit -qm "relay output"; }
          done
