name: relay
on:
  push:
    paths: ["relay/request.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        run: python relay/fetch.py
      - name: Save
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          # save ONLY this job's output files; never rewrite code files from an older checkout
          mkdir -p /tmp/keep
          for p in relay/out; do if [ -e "$p" ]; then mkdir -p "/tmp/keep/$(dirname $p)"; cp -r "$p" "/tmp/keep/$(dirname $p)/"; fi; done
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/keep/. . 2>/dev/null || true
            for p in relay/out; do if [ -e "$p" ]; then git add "$p"; fi; done
            git diff --cached --quiet && exit 0
            git commit -qm "relay output"
            git push -q && exit 0
            sleep 3
          done
