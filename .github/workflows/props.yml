name: props
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "30 22 * * *"
  push:
    paths: ["props/run.txt"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: props
  cancel-in-progress: false
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run prop model
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        run: python props/props.py
      - name: Save
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          # save ONLY this job's output files; never rewrite code files from an older checkout
          mkdir -p /tmp/keep
          for p in props/edges.json props/edges.md props/autoflags.json props/lines.json; do [ -e "$p" ] && mkdir -p "/tmp/keep/$(dirname $p)" && cp -r "$p" "/tmp/keep/$(dirname $p)/"; done
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/keep/. .
            git add props/edges.json props/edges.md props/autoflags.json props/lines.json
            git diff --cached --quiet && exit 0
            git commit -qm "prop model output"
            git push -q && exit 0
            sleep 3
          done
